version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Match the maintainer's npm min-release-age: only propose releases at least 14 days old.
    cooldown:
      default-days: 14
    ignore:
      # The development server requires Vite 7; a major upgrade needs its own migration.
      - dependency-name: vite
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
