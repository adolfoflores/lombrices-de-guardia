name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run test:simulation
        if: matrix.node == 22
      - run: npm audit --audit-level=high

  browser:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
        map: [hills, cavern, islands]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome webkit
      - run: npm run build
      - run: npm run test:browser
        env:
          TEST_PRODUCTION: '1'
          TEST_BROWSER: ${{ matrix.browser }}
          TEST_MAP: ${{ matrix.map }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-${{ matrix.browser }}-${{ matrix.map }}
          path: docs/evidence/
          if-no-files-found: ignore
          retention-days: 14

  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chrome webkit
      - run: node scripts/lobby-mobile-smoke.js
      - run: node scripts/joystick-aim-smoke.js
      - run: node scripts/result-replay-smoke.js
      - run: node scripts/arsenal-smoke.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: regressions-${{ matrix.browser }}
          path: docs/evidence/
          if-no-files-found: ignore
          retention-days: 14

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan complete Git history
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git --redact --log-opts=--all /repo

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t lombrices-check .
      - name: Check container health
        run: |
          docker run -d --name lombrices-check -p 127.0.0.1:3000:3000 lombrices-check
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          docker logs lombrices-check
          exit 1
      - run: docker rm -f lombrices-check
        if: always()
